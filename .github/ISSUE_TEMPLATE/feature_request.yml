name: Feature request
description: 提一个功能或改进
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 说场景，不要先说方案
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你想到的做法
      description: 可选。如果和 README 的「不做」清单冲突，请说明为什么值得破例
  - type: dropdown
    id: area
    attributes:
      label: 涉及哪块
      options:
        - 群聊交互 / 大脑
        - 执行与验收
        - 复核
        - 阶段推进
        - 成本与性能
        - 跨平台
        - 文档
        - 其他